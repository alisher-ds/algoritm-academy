name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Next build keshi
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Bog'liqliklarni o'rnatish
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript tekshiruvi
        run: npm run typecheck

      - name: Testlar
        run: npm test

      - name: Production build
        run: npm run build
        env:
          ADMIN_PASSWORD: ci-test-password
          NEXT_PUBLIC_SITE_URL: https://example.com

      - name: Playwright brauzerini o'rnatish
        run: npx playwright install --with-deps chromium

      - name: E2E testlar
        run: npm run test:e2e
        env:
          ADMIN_PASSWORD: ci-test-password
          NEXT_PUBLIC_SITE_URL: https://example.com
