name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bog'liqliklarni o'rnatish
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript tekshiruvi
        run: npm run typecheck

      - name: Testlar
        run: npm test

      - name: Production build
        run: npm run build
        env:
          ADMIN_PASSWORD: ci-test-password
          NEXT_PUBLIC_SITE_URL: https://example.com
