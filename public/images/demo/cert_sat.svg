<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750">
  <rect width="600" height="750" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="8" />
  
  <!-- Top CollegeBoard Header -->
  <rect x="0" y="0" width="600" height="85" fill="#002d62" />
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#ffffff">CollegeBoard</text>
  <text x="40" y="65" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">SAT SCORE REPORT</text>
  <text x="560" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="end">DIGITAL SAT</text>

  <!-- Candidate Box -->
  <rect x="40" y="110" width="520" height="100" fill="#f8fafc" stroke="#e2e8f0" rx="8" />
  <text x="60" y="140" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748b">STUDENT NAME:</text>
  <text x="60" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#0f172a">FARRUX ALIYEV</text>

  <text x="350" y="140" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748b">TEST DATE:</text>
  <text x="350" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">DECEMBER 2025</text>

  <!-- Total Score Box -->
  <rect x="40" y="230" width="520" height="150" fill="#f0f9ff" stroke="#bae6fd" rx="8" />
  <text x="60" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0369a1">TOTAL SCORE (400 - 1600):</text>
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="#002d62">1450</text>
  <rect x="250" y="290" width="130" height="36" fill="#00c853" rx="18" />
  <text x="315" y="313" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#0b1329" text-anchor="middle">98th PERCENTILE</text>

  <!-- Section Scores -->
  <rect x="40" y="400" width="250" height="130" fill="#f8fafc" stroke="#e2e8f0" rx="8" />
  <text x="60" y="430" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748b">MATH SECTION</text>
  <text x="60" y="480" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#009624">780 <tspan font-size="16" fill="#64748b">/ 800</tspan></text>
  <text x="60" y="510" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#009624">Top 1% Global Performance</text>

  <rect x="310" y="400" width="250" height="130" fill="#f8fafc" stroke="#e2e8f0" rx="8" />
  <text x="330" y="430" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748b">READING &amp; WRITING</text>
  <text x="330" y="480" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#0369a1">670 <tspan font-size="16" fill="#64748b">/ 800</tspan></text>
  <text x="330" y="510" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0369a1">Advanced Proficiency</text>

  <!-- University Grant Status -->
  <rect x="40" y="550" width="520" height="80" fill="#f0fdf4" stroke="#86efac" rx="8" />
  <text x="60" y="585" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">AQSH va Xalqaro OTMlar Grant Imkoniyati:</text>
  <text x="60" y="610" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#009624">100% Full Tuition Grantga Munosib</text>

  <text x="40" y="710" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">OFFICIAL DIGITAL SAT SCORE REPORT · ALGORITM ACADEMY</text>
</svg>