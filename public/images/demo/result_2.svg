<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00c853" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00c853" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#grad)" />
  <rect width="600" height="800" fill="url(#glow)" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.07">
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="600" x2="600" y2="600" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
  </g>

  <!-- Central Badge/Icon Graphic -->
  <circle cx="300" cy="360" r="70" fill="#00c853" fill-opacity="0.15" stroke="#00c853" stroke-width="2" stroke-dasharray="6,6" />
  <circle cx="300" cy="360" r="50" fill="#00c853" />
  <polygon points="292,342 292,378 318,360" fill="#0b1329" />

  <!-- Category Tag -->
  <rect x="40" y="50" width="160" height="36" rx="18" fill="#00c853" />
  <text x="120" y="73" fill="#0b1329" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="1">IELTS 8.0</text>

  <!-- Duration Tag -->
  <rect x="470" y="50" width="90" height="36" rx="10" fill="#000000" fill-opacity="0.6" />
  <text x="515" y="73" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">HD 1080p</text>

  <!-- Title & Subtitle at Bottom -->
  <rect x="0" y="550" width="600" height="250" fill="#0b1329" fill-opacity="0.9" />
  <line x1="0" y1="550" x2="600" y2="550" stroke="#00c853" stroke-width="3" />
  
  <text x="40" y="620" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900">IELTS 8.0 Ball</text>
  <text x="40" y="660" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">Xalqaro Til Sertifikati</text>

  <!-- Bottom Brand Watermark -->
  <text x="40" y="740" fill="#00c853" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="2">ALGORITM ACADEMY · DEMO</text>
</svg>