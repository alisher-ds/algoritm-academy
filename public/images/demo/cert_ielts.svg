<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750">
  <rect width="600" height="750" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="8" />
  
  <!-- Header -->
  <rect x="0" y="0" width="600" height="80" fill="#f8fafc" border-bottom="1px solid #e2e8f0" />
  <text x="40" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#dc2626" letter-spacing="1">IELTS</text>
  <text x="140" y="48" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155">Test Report Form</text>
  <text x="560" y="48" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="end">ACADEMIC</text>
  <line x1="0" y1="80" x2="600" y2="80" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Candidate Details Box -->
  <rect x="35" y="100" width="530" height="150" fill="#f1f5f9" rx="6" />
  <text x="50" y="125" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748b">CANDIDATE NAME:</text>
  <text x="50" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">ZILOLA USMONOVA</text>
  
  <text x="50" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748b">CANDIDATE NUMBER:</text>
  <text x="50" y="200" font-family="monospace" font-size="14" font-weight="bold" fill="#0f172a">048921 / UZ001</text>

  <text x="320" y="125" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748b">TEST DATE:</text>
  <text x="320" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">OCTOBER 2025</text>

  <text x="320" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748b">CENTRE NUMBER:</text>
  <text x="320" y="200" font-family="monospace" font-size="14" font-weight="bold" fill="#0f172a">UZ001 - BRITISH COUNCIL</text>

  <!-- Photo Box -->
  <rect x="460" y="110" width="90" height="110" fill="#e2e8f0" rx="4" stroke="#94a3b8" />
  <circle cx="505" cy="150" r="24" fill="#cbd5e1" />
  <path d="M485,195 Q505,175 525,195" fill="#cbd5e1" />

  <!-- Test Results Table -->
  <rect x="35" y="270" width="530" height="200" fill="#ffffff" stroke="#cbd5e1" rx="6" />
  
  <!-- Sub-scores Header -->
  <rect x="35" y="270" width="530" height="40" fill="#e2e8f0" />
  <text x="80" y="295" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Listening</text>
  <text x="175" y="295" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Reading</text>
  <text x="270" y="295" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Writing</text>
  <text x="365" y="295" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Speaking</text>
  <text x="475" y="295" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#dc2626" text-anchor="middle">OVERALL</text>

  <!-- Scores -->
  <text x="80" y="360" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">9.0</text>
  <text x="175" y="360" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">8.5</text>
  <text x="270" y="360" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">8.0</text>
  <text x="365" y="360" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">8.5</text>

  <!-- Big Overall Badge -->
  <rect x="435" y="325" width="80" height="55" fill="#dc2626" rx="8" />
  <text x="475" y="363" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">8.5</text>

  <!-- CEFR Level -->
  <rect x="35" y="410" width="530" height="60" fill="#f8fafc" />
  <line x1="35" y1="410" x2="565" y2="410" stroke="#cbd5e1" />
  <text x="50" y="445" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">CEFR Level: <tspan fill="#00c853" font-weight="900">C2 Expert User</tspan></text>
  <text x="545" y="445" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="end">Official Verified Result</text>

  <!-- Stamp & Validation -->
  <g transform="translate(180, 520)">
    <circle cx="120" cy="80" r="55" fill="none" stroke="#00c853" stroke-width="2" stroke-dasharray="4,2" />
    <circle cx="120" cy="80" r="45" fill="none" stroke="#00c853" stroke-width="1" />
    <text x="120" y="75" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#00c853" text-anchor="middle">BRITISH COUNCIL</text>
    <text x="120" y="92" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#00c853" text-anchor="middle">VALIDATED</text>
  </g>

  <!-- Footer Logos -->
  <text x="50" y="710" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">CAMBRIDGE ENGLISH · BRITISH COUNCIL · IDP IELTS</text>
</svg>